[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
camino = "1"
humantime = "2"
oxc_sourcemap = "9"
saphyr = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
shlex = "2"
sysinfo = { version = "0.39", default-features = false, features = ["disk", "system"] }
tempfile = "3"
thiserror = "2"
