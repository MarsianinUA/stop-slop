[package]
name = "sandbox"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish = false

[features]
fake = []
# Only `cli` turns it on (T-14); until then the live tests pass `--features sandbox/microsandbox`.
microsandbox = [
    "dep:guest",
    "dep:microsandbox",
    "dep:reqwest",
    "dep:sha2",
    "dep:tar",
    "dep:tokio",
    "dep:tracing",
]

[dependencies]
camino.workspace = true
serde.workspace = true
thiserror.workspace = true
guest = { path = "../guest", optional = true }
microsandbox = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
# Unpacks what `copy_out` brings.
tar = { workspace = true, optional = true }
tokio = { workspace = true, optional = true, features = ["fs", "io-util"] }
# The adapter never writes to stderr; `cli` decides where its log goes.
tracing = { workspace = true, optional = true }

[dev-dependencies]
sandbox = { path = ".", features = ["fake"] }
# The tree case of the contract set writes a real tar.
tar.workspace = true
tempfile.workspace = true
