services:
  prepare:
    image: node:22
    volumes: ["${STAND_REPO}:/w/app"]
    deploy: { resources: { limits: { cpus: "1", memory: 512m } } }
  api:
    image: node:24
    volumes: ["${STAND_REPO}:/w/app"]
    expose: [3000]
    depends_on:
      prepare: { condition: service_completed_successfully }
    deploy: { resources: { limits: { cpus: "1", memory: 512m } } }
  load:
    image: node:22
    depends_on: [api]
    deploy: { resources: { limits: { cpus: "1", memory: 512m } } }
x-stand: { workload: load }
