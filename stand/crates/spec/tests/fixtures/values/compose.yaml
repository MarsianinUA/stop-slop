services:
  cache:
    image: redis:7
    command: redis-server --save "" --appendonly no
    environment:
      - MODE=fast
      - EMPTY=
    expose: ["6379/tcp"]
    healthcheck:
      test: redis-cli ping
    stop_signal: SIGINT
    stop_grace_period: 1m30s
    deploy: { resources: { limits: { cpus: 0.5, memory: 1073741824 } }, replicas: 3 }
  worker:
    image: node:22
    entrypoint: ["node"]
    command: ["worker.js"]
    environment: { DEBUG: true, RATIO: 0.50, PRICE: "$$5" }
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/ready"]
      interval: 500ms
      timeout: 2s
      retries: 5
      start_period: 1m
    deploy: { resources: { limits: { cpus: "0.5", memory: "1g" } } }
  load:
    image: node:22
    depends_on: [cache, worker]
    deploy: { resources: { limits: { cpus: 2, memory: 512m } } }
x-stand:
  workload: load
  repeat: 5
  setup_timeout: 2m
  timeout: 30s
