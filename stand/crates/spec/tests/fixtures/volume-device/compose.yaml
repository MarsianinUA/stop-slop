services:
  db:
    image: postgres:17
    volumes: ["nul.data:/var/lib/postgresql/data"]
    deploy: { resources: { limits: { cpus: "1", memory: 512m } } }
  load:
    image: node:22
    deploy: { resources: { limits: { cpus: "1", memory: 512m } } }
volumes:
  nul.data: {}
x-stand: { workload: load }
