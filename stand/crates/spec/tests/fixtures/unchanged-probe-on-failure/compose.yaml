services:
  db:
    image: postgres:17
    deploy: { resources: { limits: { cpus: "1", memory: 512m } } }
  load:
    image: node:22
    depends_on: [db]
    deploy: { resources: { limits: { cpus: "1", memory: 512m } } }
x-stand:
  workload: load
  second_pass: true
  probes:
    orders: { in: db, at: on-failure, run: ["psql", "-At", "-c", "select * from orders"] }
  expect:
    unchanged:
      - { file: probe.orders.jsonl, reason: "the same orders" }
