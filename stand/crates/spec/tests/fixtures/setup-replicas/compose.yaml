services:
  seed:
    image: postgres:17
    deploy:
      resources: { limits: { cpus: "1", memory: 512m } }
      replicas: 2
  load:
    image: node:22
    depends_on:
      seed: { condition: service_completed_successfully }
    deploy: { resources: { limits: { cpus: "1", memory: 512m } } }
x-stand: { workload: load }
