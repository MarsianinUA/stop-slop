agent = """
The file imports other folders both through a tsconfig `paths` alias (`@/...`) and through `../` paths; `./` does not count. Fix: rewrite the imports of the reported style into the other one, usually `../x` into the alias in an app (`@/orders/x`), or an alias into a relative path in a package that has no alias of its own. Ignore the finding, with the reason, when the project's conventions say how to mix them (for example, `../` inside one feature folder and the alias across features).
