description = "A function or method declared above the code that calls it"
kind = "candidate"
files = "code"
source = ["personal"]
message = "`{name}` is declared above `{caller}`, which calls it, so the file stops reading top-down: a reader meets the detail before the step that needs it and keeps it in mind without knowing what it is for. Move `{name}` below `{caller}`: callers first, the helpers they use after them."
agent = """
A function at the top of the file, or a method, is declared above every function, class, variable or method of the same class that calls it. Newspaper layout: the caller comes first and the helpers it uses follow it, in the order they are first used. Move the function below its first caller (a method below the first method that calls it). Before moving a `const` function down, check that nothing calls it while the module loads, also indirectly (a hoisted function called at the top level, `new` of a class whose field calls it): code that runs before the `const` line throws a ReferenceError. Ignore the finding, with the reason, when another order is fixed on purpose: functions grouped by the project's convention (all exported API first, public methods before private ones), or overloads and a family of helpers that read better together.
"""
