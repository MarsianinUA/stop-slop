description = "A negative boolean name: `isNotActive`, `hasNoItems`"
kind = "error"
fix = true
source = ["personal"]
message = "`{name}` names a boolean by what it is not: `!{name}` reads as a double negative, and a reader has to flip the meaning twice. Name the state itself: a word for the opposite (`isInactive`, not `isNotActive`), or the positive flag negated where it is read."

[options.antonyms]
Active = "Inactive"
Allowed = "Forbidden"
Authenticated = "Unauthenticated"
Authorized = "Unauthorized"
Available = "Unavailable"
Closed = "Open"
Connected = "Disconnected"
Defined = "Undefined"
Disabled = "Enabled"
Enabled = "Disabled"
Equal = "Different"
Found = "Missing"
Hidden = "Visible"
Known = "Unknown"
