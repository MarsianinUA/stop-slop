name: Stand
on:
  pull_request:
    paths:
      - stand/**
      - shared/**
      - skill/references/**
      - .github/workflows/stand.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: stand-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
jobs:
  stand:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: stand
    steps:
      - uses: actions/checkout@v7
      # rust-cache takes the target folder relative to the workspace, and the checkout may be on
      # another drive than C:, so the target goes to the root of the checkout's drive.
      - name: Short paths on Windows, where aws-lc-sys hits MAX_PATH
        id: paths
        if: runner.os == 'Windows'
        shell: bash
        run: |
          drive=$(pwd -W | cut -c1)
          echo 'CARGO_HOME=C:\c' >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$drive:\\t" >> "$GITHUB_ENV"
          echo "target=$(realpath --relative-to=. "/${drive,,}/t")" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: stand -> ${{ steps.paths.outputs.target || 'target' }}
      - name: Node for the preload tests of profile, which start it
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: cargo fmt --check
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      # guest-release.yml builds this on a tag; here a break shows on the PR instead.
      - name: Build stand-guest for musl, as the release does
        if: runner.os == 'Linux'
        run: |
          rustup target add x86_64-unknown-linux-musl
          cargo build --locked -p guest --release --target x86_64-unknown-linux-musl
      # Ubuntu 24.04 gives an unprivileged user namespace no capabilities, so the netfilter tests
      # of guest could only skip; with them allowed, a namespace that still fails is a failure.
      - name: Let the netfilter tests run in their own namespaces
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          echo STAND_GUEST_NF_REQUIRED=1 >> "$GITHUB_ENV"
      - run: cargo test --locked --workspace
      # The root cases of guest (the probe's privilege drop, a service's stdio of another user, FITRIM
      # on a loop-mounted ext4) skipped above; here they run as root, where a skip fails, and the
      # count shows the filter matched each.
      # `--workspace` rather than `-p guest` keeps the features of the build above, so nothing is rebuilt.
      - name: Run the root cases of guest under sudo
        if: runner.os == 'Linux'
        shell: bash
        env:
          # sudo on ubuntu-26.04 ignores -E, so the switch goes through env.
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: sudo env STAND_GUEST_ROOT_REQUIRED=1
        run: |
          cargo test --locked --workspace --test guest -- --exact \
            process::exec_under_root_takes_the_probe_group_and_the_user \
            process::run_gives_a_command_of_another_user_stdio_it_can_reopen \
            trim::trim_under_root_frees_the_blocks_of_deleted_files | tee "$RUNNER_TEMP/root.log"
          grep -q ' 3 passed;' "$RUNNER_TEMP/root.log"
