[workspace]
resolver = "3"
members = ["crates/catalog", "crates/engine", "crates/kit", "crates/repo", "crates/testkit", "rules"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
camino = "1"
libtest-mimic = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
similar = "3"
tempfile = "3"
thiserror = "2"
toml = "1"
