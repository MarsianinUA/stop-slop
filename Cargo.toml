[workspace]
resolver = "3"
members = ["crates/catalog", "crates/cli", "crates/engine", "crates/kit", "crates/project", "crates/repo", "crates/scope", "crates/state", "rules", "shared/gitcmd", "shared/testkit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
camino = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
json-strip-comments = "3"
libtest-mimic = "0.8"
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
similar = "3"
tempfile = "3"
thiserror = "2"
toml = "1"
